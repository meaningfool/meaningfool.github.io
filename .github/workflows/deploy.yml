name: Deploy

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Build pull requests, including Dependabot updates, without deploying them.
  pull_request:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  # meaningfool-writing also starts it this way when published content changes.
  workflow_dispatch:

# Clone the repository. Deploys authenticate to Cloudflare with the secrets below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs on main deploy to Cloudflare, so they go one at a time. Pull requests
    # use a group of their own, so they never take the place of a queued deployment.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'cloudflare' }}
      cancel-in-progress: false
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # Build the latest content on meaningfool-writing's main branch rather
      # than the commit the submodule pointer records.
      - name: Fetch the latest content
        run: git submodule update --init --remote --depth 1 src/content/writing

      # withastro/action sets up Node and Bun, keeps Astro's image cache between
      # runs, and builds dist/. It also uploads a GitHub Pages artifact, which
      # nothing uses since the site moved to Cloudflare (#15).
      - name: Install and build the site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: bun@1.4.4

      - name: Check the Cloudflare deploy
        if: github.event_name == 'pull_request'
        run: bunx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

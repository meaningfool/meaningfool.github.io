name: Deploy

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Build pull requests, including Dependabot updates, without deploying them.
  pull_request:
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  # meaningfool-writing also starts it this way when published content changes.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs on main also deploy to Cloudflare, so they go one at a time. Pull requests
    # use a group of their own, so they never take the place of a queued deployment.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'cloudflare' }}
      cancel-in-progress: false
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # Build the latest content on meaningfool-writing's main branch rather
      # than the commit the submodule pointer records.
      - name: Fetch the latest content
        run: git submodule update --init --remote --depth 1 src/content/writing

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: bun@1.4.4

      # While meaningfool.net moves from GitHub Pages to Cloudflare Workers (#15),
      # the same build goes to both. Pull requests only check the Cloudflare deploy.
      - name: Check the Cloudflare deploy
        if: github.event_name == 'pull_request'
        run: bunx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # Set on this job so pull request builds never take the place of a queued deployment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
